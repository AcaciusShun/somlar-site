name: Sync Library (NeoDB)

# Polls NeoDB and commits src/data/library-snapshot.json ONLY when your marks
# changed. That commit's push is what triggers a Cloudflare Pages build — so the
# site deploys on (a) your own commits and (b) real NeoDB changes, never on a
# blind timer. Unchanged runs do nothing and leave no deployment behind.
#
# Setup (one-time):
#   GitHub repo → Settings → Secrets and variables → Actions:
#     - Secret   NEODB_TOKEN    (read-scope token from https://<instance>/developer)
#     - Variable NEODB_INSTANCE (optional, defaults to https://neodb.social)
#
# Note: don't put "[skip ci]" / "[CI Skip]" in the commit message below —
# Cloudflare Pages honours those and would skip the build.

on:
  schedule:
    # GitHub cron is UTC-only. Every 3h during UTC+8 09:00–00:00; checks are free,
    # deploys only happen when something changed.
    - cron: "0 1,4,7,10,13,16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite the snapshot even if only community ratings/synopses changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: neodb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Fetch NeoDB marks
        env:
          NEODB_TOKEN: ${{ secrets.NEODB_TOKEN }}
          NEODB_INSTANCE: ${{ vars.NEODB_INSTANCE }}
          FORCE: ${{ inputs.force }}
        run: node scripts/sync-neodb.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- src/data/library-snapshot.json; then
            echo "Snapshot unchanged — nothing to deploy."
            exit 0
          fi
          count=$(node -e 'console.log(require("./src/data/library-snapshot.json").length)')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/library-snapshot.json
          git commit -m "chore(library): sync NeoDB snapshot (${count} items)"
          git push
